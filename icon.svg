<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="4"/>
  
  <!-- Calendar Body -->
  <rect x="88" y="104" width="336" height="312" rx="36" fill="#1c222e" stroke="rgba(255,255,255,0.12)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Calendar Header Strip -->
  <path d="M 88 144 C 88 121.9 105.9 104 128 104 L 384 104 C 406.1 104 424 121.9 424 144 L 424 176 L 88 176 Z" fill="url(#gold)"/>
  
  <!-- Binder pins -->
  <rect x="152" y="80" width="24" height="48" rx="12" fill="#f1f5f9"/>
  <rect x="336" y="80" width="24" height="48" rx="12" fill="#f1f5f9"/>
  
  <!-- Bulldozer / Shift Badges Inside -->
  <!-- 2/2 Label -->
  <text x="256" y="260" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="64" fill="#fbbf24" text-anchor="middle" letter-spacing="-2">2 / 2</text>
  
  <!-- Track / Bulldozer Blade Minimalist Icon -->
  <path d="M 140 330 L 372 330" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <rect x="160" y="344" width="192" height="28" rx="14" fill="#334155" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="184" cy="358" r="7" fill="#fbbf24"/>
  <circle cx="232" cy="358" r="7" fill="#fbbf24"/>
  <circle cx="280" cy="358" r="7" fill="#fbbf24"/>
  <circle cx="328" cy="358" r="7" fill="#fbbf24"/>

  <!-- Subtext -->
  <text x="256" y="302" font-family="-apple-system, system-ui, sans-serif" font-weight="700" font-size="22" fill="#94a3b8" text-anchor="middle" letter-spacing="4">ДЕНЬ • НОЧЬ</text>
</svg>