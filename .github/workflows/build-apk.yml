name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android zip if needed
        run: |
          if [ ! -d "android-app/app" ]; then
            for z in bulldozer-android-widget.zip android-project.zip; do
              if [ -f "$z" ]; then
                mkdir -p android-app
                unzip -o "$z" -d android-app
                break
              fi
            done
          fi

      - name: Cache debug keystore for seamless OTA updates
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.1.${{ github.run_number }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export APP_VERSION_CODE=$((APP_VERSION_CODE + 10))
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../bulldozer-2-2.apk
          else
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../bulldozer-2-2.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bulldozer-2-2-apk
          path: bulldozer-2-2.apk

      - name: Publish GitHub Release for OTA auto-update
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.${{ github.run_number }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bulldozer-2-2.apk --clobber
          else
            gh release create "$TAG" bulldozer-2-2.apk \
              --title "Бульдозер 2/2 $TAG" \
              --notes "Автоматическая сборка приложения, уведомлений и виджета 4×2 ($TAG)."
          fi
